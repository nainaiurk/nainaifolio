<!-- Project Modal -->
<div id="projectModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="portfolio.closeModal('projectModal')">&times;</button>
    <h2 id="modalTitle"></h2>
    <p id="modalSubtitle" class="text-secondary mb-2"></p>
    <div id="modalImageContainer"></div>
    <p id="modalDescription" class="mb-2"></p>
    <div id="modalAchievements"></div>
    <div id="modalLinks" class="modal-links"></div>
  </div>
</div>

<!-- Award Modal -->
<div id="awardModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="portfolio.closeModal('awardModal')">&times;</button>
    <img id="awardModalImage" src="" alt="Certificate">
    <h2 id="awardModalTitle"></h2>
    <p><strong>Issuer:</strong> <span id="awardModalIssuer"></span></p>
    <p><strong>Date:</strong> <span id="awardModalDate"></span></p>
    <p id="awardModalHighlights" class="mb-2"></p>
    <div id="awardModalTags"></div>
  </div>
</div>

<!-- Expertise Modal -->
<div id="expertiseModal" class="modal">
  <div class="modal-content expertise-modal-content">
    <button class="modal-close" onclick="portfolio.closeModal('expertiseModal')">&times;</button>
    <div id="expertiseModalIcon" class="expertise-modal-icon"></div>
    <h2 id="expertiseModalTitle"></h2>
    <p id="expertiseModalDescription" class="expertise-modal-description"></p>
  </div>
</div>
